<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vulnerable Gradebook</title>
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <script src="assets/theme.js"></script>
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <link rel="stylesheet" href="assets/theme.css" />
    <link rel="stylesheet" href="demo.css" />
  </head>
  <body>
    <div class="page-tools floating-tools">
      <a href="index.html">← Portfolio</a>
      <div class="theme-controls" aria-label="Color theme">
        <button
          type="button"
          data-theme-toggle
          aria-label="Switch theme"
          title="Switch theme"
        >
          <svg class="theme-sun" viewbox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path
              d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            ></path></svg
          ><svg class="theme-moon" viewbox="0 0 24 24" aria-hidden="true">
            <path d="M20.8 13A9 9 0 0 1 11 3.2 9 9 0 1 0 20.8 13Z"></path>
          </svg></button
        ><button
          type="button"
          data-theme-auto
          aria-pressed="true"
          title="Use browser theme"
        >
          Auto
        </button>
      </div>
    </div>
    <div class="container" id="login-screen">
      <h2>Student Login</h2>
      <p class="demo-note">
        Fictional data · intentionally vulnerable access-control exercise.
      </p>
      <p>Enter your Student ID to view grades.</p>
      <p><i>(Hint: You are Bob. Your ID is 102)</i></p>
      <input
        type="text"
        id="username_input"
        placeholder="Enter Student ID (e.g., 102)"
        aria-label="Fictional student ID"
      />
      <br />
      <button id="demoLogin">Login</button>
    </div>

    <div class="container hidden" id="dashboard-screen">
      <h2>Grade Report</h2>
      <div id="result_area">Loading...</div>
      <br />
      <button id="demoLogout">Logout</button>
    </div>

    <script src="demo.js" defer></script>
  </body>
</html>
