<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <title>Web Challenges Story HTML Slides</title>
    <script src="assets/theme.js"></script>
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <link rel="stylesheet" href="assets/theme.css" />
    <link rel="stylesheet" href="stf.css" />
  </head>
  <body>
    <div class="page-tools floating-tools">
      <a href="index.html">← Portfolio</a>
      <div class="theme-controls" aria-label="Color theme">
        <button
          type="button"
          data-theme-toggle
          aria-label="Switch theme"
          title="Switch theme"
        >
          <svg class="theme-sun" viewbox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path
              d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            ></path></svg
          ><svg class="theme-moon" viewbox="0 0 24 24" aria-hidden="true">
            <path d="M20.8 13A9 9 0 0 1 11 3.2 9 9 0 1 0 20.8 13Z"></path>
          </svg></button
        ><button
          type="button"
          data-theme-auto
          aria-pressed="true"
          title="Use browser theme"
        >
          Auto
        </button>
      </div>
    </div>
    <div class="deck">
      <div class="card">
        <div>
          <h1 id="slide-title">Web Challenges Story</h1>
          <div id="slide-content" class="content"></div>
        </div>

        <div>
          <div class="meta">
            <div id="counter">1 / 23</div>
            <div class="bar"><span id="progress"></span></div>
            <div class="kbhint">Tip: ← / → to navigate • P to print</div>
          </div>

          <div class="nav">
            <button id="prev" class="ghost">◀ Previous</button>
            <div class="spacer"></div>
            <button id="next">Next ▶</button>
          </div>
        </div>
      </div>
    </div>

    <script src="stf.js" defer></script>
  </body>
</html>
