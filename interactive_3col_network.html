<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Companion Tutorial Analysis</title>
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="assets/theme.js"></script>
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <link rel="stylesheet" href="assets/theme.css" />
    <link rel="stylesheet" href="network.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>Companion Tutorial Analysis</h1>
        <div class="muted">
          Depth 0 → 1 → 2 · Cycle edges highlighted in
          <span style="color: #d61f1f">red</span>
        </div>
      </div>
      <div class="controls">
        <label
          >Min weight:
          <input id="wslider" type="range" min="0" max="10" value="0" />
        </label>
        <span id="wval" class="pill">0</span>
        <button id="fitBtn">Fit to screen</button>
        <button id="resetBtn">Reset view</button>
        <div class="theme-controls" aria-label="Color theme">
          <button
            type="button"
            data-theme-toggle
            aria-label="Switch theme"
            title="Switch theme"
          >
            <svg class="theme-sun" viewbox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path
                d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              ></path></svg
            ><svg class="theme-moon" viewbox="0 0 24 24" aria-hidden="true">
              <path d="M20.8 13A9 9 0 0 1 11 3.2 9 9 0 1 0 20.8 13Z"></path>
            </svg></button
          ><button
            type="button"
            data-theme-auto
            aria-pressed="true"
            title="Use browser theme"
          >
            Auto
          </button>
        </div>
      </div>
    </header>

    <div id="cy"></div>

    <aside>
      <div class="section-title">Overall</div>
      <div id="overall" class="stat"></div>

      <div class="section-title">Top Keywords</div>
      <div id="topkw"></div>

      <div class="section-title">Selected Node</div>
      <div id="selTitle" class="stat muted">
        Click a node to inspect its neighborhood.
      </div>
      <div id="selStats"></div>
    </aside>

    <!-- ========= Paste your JSON below =========
       1) elements_json: array of nodes+edges (Cytoscape format)
          - Nodes need: { data:{ id, label, depth, full }, position?:{x,y} }
          - Edges need: { data:{ id, source, target, weight, keywords[], cycle } }
          - If "position" is omitted, the page will auto-assign 3-column positions.
       2) summary_json: { total_nodes, total_edges, cycles }
       3) top_keywords_json: [{ keyword, count }, ...]
  ============================================ -->

    <script src="assets/cytoscape.min.js" defer></script>
    <script src="assets/network-data.js" defer></script>
    <script src="network.js" defer></script>
  </body>
</html>
